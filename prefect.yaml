name: my-etl-project
prefect-version: 3.6.23
pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/nathan6012/Multi_Source_ETLT-.git
      branch: main
      id: clone_step

  - prefect.deployments.steps.run_shell_script:
      id: setup_env
      script: |
        pip install --upgrade pip
        pip install -r requirements.txt
      directory: "{{ clone_step.directory }}"

deployments:
  - name: master-etl-deployment
    entrypoint: app/main.py:etl_orchestrator
    
    on_failure:
      - app.main.notify_failure
    on_completion:
      - app.main.notify_success
    
    job_variables:
      env: {} 
    work_pool:
      name: My_etl_System

    schedule:
      cron: "*/5 * * * *"
      timezone: "UTC"  
    
   # schedule:
    #  cron: "0 0 * * *"
    #  timezone: "UTC"  

    tags: ["etl"]
    retries: 2
    retry_delay_seconds: 60
